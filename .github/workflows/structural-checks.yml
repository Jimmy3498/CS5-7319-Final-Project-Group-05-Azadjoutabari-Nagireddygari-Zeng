name: Scaffold structural checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_scaffold.py
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s tests -v
  build:
    needs: structural
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [layered, event_based]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m ${{ matrix.architecture }}.build
