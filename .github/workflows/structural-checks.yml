name: Scaffold structural checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Others/requirements-dev.txt
      - run: ruff check --config Others/pyproject.toml .
      - run: ruff format --check --config Others/pyproject.toml .
      - run: python Others/run_checks.py
  build:
    needs: structural
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - architecture: layered
            folder: Selected
          - architecture: event_based
            folder: Unselected
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m ${{ matrix.architecture }}.build
        working-directory: ${{ matrix.folder }}
